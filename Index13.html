  <script type="module">
    import { Muxer, ArrayBufferTarget } from "https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/+esm";

    // =========================================================================
    // CONSTANTS & FILL-INS
    // =========================================================================
    const BRAND = "ezsites";
    const CONTACT = "+91 8102253186";
    const CLINIC_DEMO = "Smile Care Dental Clinic";
    const CITY_DEMO = "Patna";
    const DURATION = 22;

    const COLORS = {
      navy: "#07121F",
      softWhite: "#F6FBFB",

    };

    // =========================================================================
    // SFX CUES & WEB AUDIO SYNTHESIZER (SHARED BY PREVIEW AND EXPORT)
    // =========================================================================
    const SFX_CUES = [
      // SCENE 1 (0 - 4s)
      { t: 0.2, type: "whoosh" },
      { t: 0.5, type: "tick" },
      { t: 0.9, type: "pop" },
      { t: 1.3, type: "tick" },

      { t: 20.2, type: "final-chime" }
    ];

    function createMasterChain(ctx, destination) {
      const compressor = ctx.createDynamicsCompressor();
      compressor.threshold.setValueAtTime(-12, 0);
      compressor.knee.setValueAtTime(10, 0);
      compressor.ratio.setValueAtTime(8, 0);
      compressor.attack.setValueAtTime(0.003, 0);
      compressor.release.setValueAtTime(0.15, 0);

      const masterGain = ctx.createGain();
      masterGain.gain.setValueAtTime(0.25, 0);

      masterGain.connect(compressor);
      compressor.connect(destination || ctx.destination);
      return masterGain;
    }

    function makeNoiseBuffer(ctx, seconds) {
      const length = Math.max(1, Math.floor(ctx.sampleRate * seconds));
      const buffer = ctx.createBuffer(1, length, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      let seed = 1337;
      for (let i = 0; i < length; i++) {
        seed = (seed * 16807) % 2147483647;
        data[i] = ((seed - 1) / 1073741823.5) - 1;
      }
      return buffer;
    }

    function scheduleCue(ctx, master, type, startTime) {
      const t = Math.max(0, startTime);

      if (type === "whoosh") {
        const dur = 0.35;
        const src = ctx.createBufferSource();
        src.buffer = makeNoiseBuffer(ctx, dur);

        const filter = ctx.createBiquadFilter();
        filter.type = "bandpass";
        filter.Q.setValueAtTime(2.2, t);
        filter.frequency.setValueAtTime(400, t);
        filter.frequency.exponentialRampToValueAtTime(2500, t + dur);

        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(0.45, t + 0.08);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

        src.connect(filter);
        filter.connect(g);
        g.connect(master);
        src.start(t);
        src.stop(t + dur);
      } else if (type === "slide") {
        const dur = 0.2;
        const src = ctx.createBufferSource();
        src.buffer = makeNoiseBuffer(ctx, dur);

        const filter = ctx.createBiquadFilter();
        filter.type = "bandpass";
        filter.Q.setValueAtTime(3.0, t);
        filter.frequency.setValueAtTime(650, t);
        filter.frequency.exponentialRampToValueAtTime(1800, t + dur);

        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(0.24, t + 0.04);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

        src.connect(filter);
        filter.connect(g);
        g.connect(master);
        src.start(t);
        src.stop(t + dur);
      } else if (type === "pop") {
        const dur = 0.12;
        const osc = ctx.createOscillator();
        osc.type = "sine";
        osc.frequency.setValueAtTime(700, t);
        osc.frequency.exponentialRampToValueAtTime(250, t + dur);

        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(0.65, t + 0.012);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

        osc.connect(g);
        g.connect(master);
        osc.start(t);
        osc.stop(t + dur);
      } else if (type === "tick") {
        const dur = 0.05;
        const osc = ctx.createOscillator();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(1200, t);

        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(0.5, t + 0.006);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

        osc.connect(g);
        g.connect(master);
        osc.start(t);
        osc.stop(t + dur);
      } else if (type === "chime") {
        const notes = [
          { freq: 880, offset: 0, dur: 0.35 },
          { freq: 1320, offset: 0.08, dur: 0.4 }
        ];
        for (const n of notes) {
          const nt = t + n.offset;
          const osc = ctx.createOscillator();
          osc.type = "sine";
          osc.frequency.setValueAtTime(n.freq, nt);

          const g = ctx.createGain();
          g.gain.setValueAtTime(0.0001, nt);
          g.gain.linearRampToValueAtTime(0.45, nt + 0.015);
          g.gain.exponentialRampToValueAtTime(0.0001, nt + n.dur);

          osc.connect(g);
          g.connect(master);
          osc.start(nt);
          osc.stop(nt + n.dur);
        }
      } else if (type === "empty-ping") {
        const notes = [
          { freq: 520, offset: 0, dur: 0.18 },
          { freq: 390, offset: 0.14, dur: 0.21 }
        ];
        for (const n of notes) {
          const nt = t + n.offset;
          const osc = ctx.createOscillator();
          osc.type = "sine";
          osc.frequency.setValueAtTime(n.freq, nt);

          const g = ctx.createGain();
          g.gain.setValueAtTime(0.0001, nt);
          g.gain.linearRampToValueAtTime(0.5, nt + 0.012);
          g.gain.exponentialRampToValueAtTime(0.0001, nt + n.dur);

          osc.connect(g);
          g.connect(master);
          osc.start(nt);
          osc.stop(nt + n.dur);
        }
      } else if (type === "final-chime") {
        const notes = [
          { freq: 660, offset: 0, dur: 0.55 },
          { freq: 880, offset: 0.1, dur: 0.65 },
          { freq: 1320, offset: 0.2, dur: 0.8 }
        ];
        for (const n of notes) {
          const nt = t + n.offset;
          const osc = ctx.createOscillator();
          osc.type = "sine";
          osc.frequency.setValueAtTime(n.freq, nt);

          const g = ctx.createGain();
          g.gain.setValueAtTime(0.0001, nt);
          g.gain.linearRampToValueAtTime(0.42, nt + 0.02);
          g.gain.exponentialRampToValueAtTime(0.0001, nt + n.dur);

          osc.connect(g);
          g.connect(master);
          osc.start(nt);
          osc.stop(nt + n.dur);
        }
      }
    }

    function scheduleAllSfx(ctx, baseTime = 0, destination = null) {
      const master = createMasterChain(ctx, destination);
      for (const cue of SFX_CUES) {
        scheduleCue(ctx, master, cue.type, baseTime + cue.t);
      }
    }

    async function renderOfflineAudio() {
      const sampleRate = 44100;
      const totalFrames = sampleRate * DURATION;
      const offlineCtx = new OfflineAudioContext(2, totalFrames, sampleRate);
      scheduleAllSfx(offlineCtx, 0, offlineCtx.destination);
      return await offlineCtx.startRendering();
    }

    // =========================================================================

      // --- SCENE 5 (13 - 16s) ---

    // =========================================================================
    // CANVAS 2D DRAWING HELPERS
    // =========================================================================
    function lerpColor(hexA, hexB, t) {
      const a = parseInt(hexA.slice(1), 16);
      const b = parseInt(hexB.slice(1), 16);
      const ar = (a >> 16) & 255, ag = (a >> 8) & 255, ab = a & 255;
      const br = (b >> 16) & 255, bg = (b >> 8) & 255, bb = b & 255;
      const r = Math.round(ar + (br - ar) * t);
      const g = Math.round(ag + (bg - ag) * t);
      const bl = Math.round(ab + (bb - ab) * t);
      return `rgb(${r}, ${g}, ${bl})`;
    }

    function roundRectPath(ctx, x, y, w, h, r) {
      const radius = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.arcTo(x + w, y, x + w, y + h, radius);
      ctx.arcTo(x + w, y + h, x, y + h, radius);
      ctx.arcTo(x, y + h, x, y, radius);
      ctx.arcTo(x, y, x + w, y, radius);
      ctx.closePath();
    }

    function drawChip(ctx, text, cx, y, alpha, offsetY, isDarkBg) {
      if (alpha <= 0.001) return;
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(0, offsetY);

      ctx.font = "700 40px 'Plus Jakarta Sans'";
      const textW = ctx.measureText(text).width;
      const padX = 34;
      const h = 68;
      const w = textW + padX * 2;
      const x = cx - w / 2;

      roundRectPath(ctx, x, y, w, h, h / 2);
      ctx.fillStyle = isDarkBg ? "rgba(15, 181, 174, 0.16)" : "rgba(15, 181, 174, 0.14)";
      ctx.fill();
      ctx.lineWidth = 2.5;
      ctx.strokeStyle = COLORS.teal;
      ctx.stroke();

      ctx.fillStyle = isDarkBg ? COLORS.softWhite : COLORS.deepBlue;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(text, cx, y + h / 2 + 2);
      ctx.restore();
    }

    function drawHeadline(ctx, lines, highlights, cx, startY, alpha, offsetY, baseColor, highlightColor) {
      if (alpha <= 0.001) return;
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(0, offsetY);

      const fontSize = 92;
      const lineHeight = Math.round(fontSize * 1.15);
      ctx.font = `800 ${fontSize}px 'Plus Jakarta Sans'`;
      ctx.textBaseline = "top";
      ctx.textAlign = "left";

      lines.forEach((lineText, idx) => {
        const y = startY + idx * lineHeight;
        const lowerLine = lineText.toLowerCase();
        const charHighlight = new Array(lineText.length).fill(false);

        for (const phrase of highlights) {
          const lp = phrase.toLowerCase();
          let pos = lowerLine.indexOf(lp);
          while (pos !== -1) {
            for (let k = pos; k < pos + lp.length; k++) charHighlight[k] = true;
            pos = lowerLine.indexOf(lp, pos + lp.length);
          }
        }

        const runs = [];
        let i = 0;
        while (i < lineText.length) {
          const isHi = charHighlight[i];
          let j = i + 1;
          while (j < lineText.length && charHighlight[j] === isHi) j++;
          runs.push({ text: lineText.slice(i, j), highlight: isHi });
          i = j;
        }

        const totalWidth = ctx.measureText(lineText).width;
        let curX = cx - totalWidth / 2;

        for (const run of runs) {
          ctx.fillStyle = run.highlight ? highlightColor : baseColor;
          ctx.fillText(run.text, curX, y);
          curX += ctx.measureText(run.text).width;
        }
      });

      ctx.restore();
    }

    function drawToothIcon(ctx, cx, cy, size, color) {
      ctx.save();
      ctx.translate(cx, cy);
      const s = size / 100;
      ctx.scale(s, s);
      ctx.beginPath();
      ctx.moveTo(0, -34);
      ctx.bezierCurveTo(14, -46, 40, -44, 42, -16);
      ctx.bezierCurveTo(44, 6, 32, 18, 28, 38);
      ctx.bezierCurveTo(25, 48, 15, 48, 11, 32);
      ctx.bezierCurveTo(7, 18, -7, 18, -11, 32);
      ctx.bezierCurveTo(-15, 48, -25, 48, -28, 38);
      ctx.bezierCurveTo(-32, 18, -44, 6, -42, -16);
      ctx.bezierCurveTo(-40, -44, -14, -46, 0, -34);
      ctx.closePath();
      ctx.fillStyle = color;
      ctx.fill();
      ctx.restore();
    }

    function drawStar(ctx, cx, cy, outerR, innerR, color) {
      ctx.save();
      ctx.beginPath();
      for (let i = 0; i < 10; i++) {
        const r = i % 2 === 0 ? outerR : innerR;
        const angle = -Math.PI / 2 + (i * Math.PI) / 5;
        const x = cx + Math.cos(angle) * r;
        const y = cy + Math.sin(angle) * r;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.fillStyle = color;
      ctx.fill();
      ctx.restore();
    }

    // =========================================================================

    function showError(msg) {

      errorBox.textContent = msg;
    }

    function clearError() {
      errorBox.style.display = "none";
      errorBox.textContent = "";

    function stopPreview() {
      if (previewRafId) {
        cancelAnimationFrame(previewRafId);
        previewRafId = null;

      if (previewAudioCtx) {
        try { previewAudioCtx.close(); } catch (_) {}
        previewAudioCtx = null;

    async function loadFonts() {

        document.fonts.load("500 40px 'Plus Jakarta Sans'"),

      ]);

    function startPreview() {
      if (isExporting) return;
      clearError();
      stopPreview();

      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      previewAudioCtx = new AudioCtx();
      if (previewAudioCtx.state === "suspended") {
        previewAudioCtx.resume();
      }

      const startTime = previewAudioCtx.currentTime + 0.05;
      scheduleAllSfx(previewAudioCtx, startTime, previewAudioCtx.destination);
      statusText.textContent = "Playing preview (0.0s / 22.0s)...";

      function tick() {
        if (!previewAudioCtx) return;
        const elapsed = Math.max(0, previewAudioCtx.currentTime - startTime);
        if (elapsed >= DURATION) {
          tl.time(DURATION);
          drawFrame(ctx);
          statusText.textContent = "Preview complete (22.0s).";
          stopPreview();
          return;
        }
        tl.time(elapsed);
        drawFrame(ctx);
        statusText.textContent = `Playing preview (${elapsed.toFixed(1)}s / ${DURATION}.0s)...`;
        previewRafId = requestAnimationFrame(tick);
      }

      previewRafId = requestAnimationFrame(tick);
    }

    async function fallbackMediaRecorderExport() {
      statusText.textContent = "WebCodecs unavailable — recording real-time fallback (22s)...";
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      const recAudioCtx = new AudioCtx();
      if (recAudioCtx.state === "suspended") await recAudioCtx.resume();

      const dest = recAudioCtx.createMediaStreamDestination();
      const canvasStream = canvas.captureStream(FPS);
      const combined = new MediaStream([
        ...canvasStream.getVideoTracks(),
        ...dest.stream.getAudioTracks()
      ]);

      const mimeCandidates = [
        "video/mp4;codecs=avc1,mp4a.40.2",
        "video/mp4",
        "video/webm;codecs=vp9,opus",
        "video/webm"
      ];
      let chosenMime = "";
      for (const m of mimeCandidates) {
        if (window.MediaRecorder && MediaRecorder.isTypeSupported(m)) {
          chosenMime = m;
          break;
        }
      }

      const recorder = new MediaRecorder(combined, chosenMime ? { mimeType: chosenMime, videoBitsPerSecond: 8_000_000 } : undefined);
      const chunks = [];
      recorder.ondataavailable = (e) => { if (e.data && e.data.size > 0) chunks.push(e.data); };

      const donePromise = new Promise((resolve, reject) => {
        recorder.onstop = () => resolve();
        recorder.onerror = (e) => reject(e.error || new Error("MediaRecorder failed"));
      });

      const startTime = recAudioCtx.currentTime + 0.05;
      scheduleAllSfx(recAudioCtx, startTime, dest);
      scheduleAllSfx(recAudioCtx, startTime, recAudioCtx.destination);
      recorder.start();

      await new Promise((resolve) => {
        function step() {
          const elapsed = Math.max(0, recAudioCtx.currentTime - startTime);
          if (elapsed >= DURATION) {
            tl.time(DURATION);
            drawFrame(ctx);
            resolve();
            return;
          }
          tl.time(elapsed);
          drawFrame(ctx);
          const pct = Math.min(99, Math.round((elapsed / DURATION) * 100));
          statusText.textContent = `Fallback real-time recording ${pct}%...`;
          requestAnimationFrame(step);
        }
        requestAnimationFrame(step);
      });

      recorder.stop();
      await donePromise;
      try { await recAudioCtx.close(); } catch (_) {}

      const isMp4 = chosenMime.includes("mp4");
      const blob = new Blob(chunks, { type: chosenMime || "video/webm" });
      finishDownload(blob, isMp4 ? "ezsites-homepage-5-seconds-reel.mp4" : "ezsites-homepage-5-seconds-reel.webm");
      statusText.textContent = `Exported via real-time MediaRecorder fallback (${isMp4 ? "MP4" : "WebM"}).`;
    }

    function finishDownload(blob, filename) {
      const url = URL.createObjectURL(blob);
      downloadAgainLink.href = url;
      downloadAgainLink.download = filename;
      resultVideo.src = url;
      resultArea.style.display = "flex";

      const tempA = document.createElement("a");
      tempA.href = url;
      tempA.download = filename;
      document.body.appendChild(tempA);
      tempA.click();
      tempA.remove();
    }

    async function exportMp4() {
      if (isExporting) return;
      isExporting = true;
      stopPreview();
      clearError();
      previewBtn.disabled = true;
      exportBtn.disabled = true;
      resultArea.style.display = "none";

      let wakeLock = null;
      try {
        if ("wakeLock" in navigator) {
          wakeLock = await navigator.wakeLock.request("screen");
        }
      } catch (_) {}

      try {
        await loadFonts();

        if (typeof VideoEncoder === "undefined") {
          await fallbackMediaRecorderExport();
          return;
        }

        statusText.textContent = "Synthesizing audio track...";
        const audioBuffer = await renderOfflineAudio();

        const codecCandidates = ["avc1.64002A", "avc1.640028", "avc1.4D0028"];
        let selectedVideoConfig = null;
        for (const codec of codecCandidates) {
          const cfg = {
            codec,
            width: WIDTH,
            height: HEIGHT,
            bitrate: 8_000_000,
            framerate: FPS
          };
          const res = await VideoEncoder.isConfigSupported(cfg);
          if (res.supported) {
            selectedVideoConfig = cfg;
            break;
          }
        }

        if (!selectedVideoConfig) {
          await fallbackMediaRecorderExport();
          return;
        }

        let canEncodeAudio = false;
        const audioConfig = {
          codec: "mp4a.40.2",
          sampleRate: 44100,
          numberOfChannels: 2,
          bitrate: 128000
        };
        if (typeof AudioEncoder !== "undefined") {
          try {
            const aRes = await AudioEncoder.isConfigSupported(audioConfig);
            canEncodeAudio = Boolean(aRes.supported);
          } catch (_) {
            canEncodeAudio = false;
          }
        }

        const muxerOptions = {
          target: new ArrayBufferTarget(),
          video: {
            codec: "avc",
            width: WIDTH,
            height: HEIGHT
          },
          fastStart: "in-memory"
        };
        if (canEncodeAudio) {
          muxerOptions.audio = {
            codec: "aac",
            numberOfChannels: 2,
            sampleRate: 44100
          };
        }
        const muxer = new Muxer(muxerOptions);

        let encoderFailure = null;
        const videoEncoder = new VideoEncoder({
          output: (chunk, meta) => muxer.addVideoChunk(chunk, meta),
          error: (err) => { encoderFailure = err; }
        });
        videoEncoder.configure(selectedVideoConfig);

        let audioEncoder = null;
        if (canEncodeAudio) {
          audioEncoder = new AudioEncoder({
            output: (chunk, meta) => muxer.addAudioChunk(chunk, meta),
            error: (err) => { encoderFailure = err; }
          });
          audioEncoder.configure(audioConfig);

          const ch0 = audioBuffer.getChannelData(0);
          const ch1 = audioBuffer.getChannelData(1);
          const totalSamples = audioBuffer.length;
          const chunkSize = 1024;

          for (let offset = 0; offset < totalSamples; offset += chunkSize) {
            if (encoderFailure) throw encoderFailure;
            const frames = Math.min(chunkSize, totalSamples - offset);
            const planarData = new Float32Array(frames * 2);
            planarData.set(ch0.subarray(offset, offset + frames), 0);
            planarData.set(ch1.subarray(offset, offset + frames), frames);

            const timestampUs = Math.round((offset / 44100) * 1_000_000);
            const audioData = new AudioData({
              format: "f32-planar",
              sampleRate: 44100,
              numberOfFrames: frames,
              numberOfChannels: 2,
              timestamp: timestampUs,
              data: planarData
            });
            audioEncoder.encode(audioData);
            audioData.close();
          }
          await audioEncoder.flush();
        }

        const totalFrames = DURATION * FPS;
        const frameDurationUs = Math.round(1_000_000 / FPS);

        for (let i = 0; i < totalFrames; i++) {
          if (encoderFailure) throw encoderFailure;

          const t = i / FPS;
          tl.time(t);
          drawFrame(ctx);

          const timestampUs = Math.round((i * 1_000_000) / FPS);
          const vf = new VideoFrame(canvas, {
            timestamp: timestampUs,
            duration: frameDurationUs
          });

          videoEncoder.encode(vf, { keyFrame: i % 30 === 0 });
          vf.close();

          while (videoEncoder.encodeQueueSize > 8) {
            if (encoderFailure) throw encoderFailure;
            await new Promise((r) => setTimeout(r, 4));
          }

          if (i % 10 === 0 || i === totalFrames - 1) {
            const pct = Math.round(((i + 1) / totalFrames) * 100);
            statusText.textContent = `Exporting ${pct}%`;
            await new Promise((r) => setTimeout(r, 0));
          }
        }

        await videoEncoder.flush();
        videoEncoder.close();
        if (audioEncoder) audioEncoder.close();
        if (encoderFailure) throw encoderFailure;

        muxer.finalize();
        const { buffer } = muxer.target;
        const blob = new Blob([buffer], { type: "video/mp4" });
        finishDownload(blob, "ezsites-homepage-5-seconds-reel.mp4");

        if (canEncodeAudio) {
          statusText.textContent = "Export complete! Your 22s MP4 (video + SFX) has downloaded.";
        } else {
          statusText.textContent = "Export complete (video only — AudioEncoder AAC unsupported in this browser).";
        }
      } catch (err) {
        console.error(err);
        showError(`Export error: ${err && err.message ? err.message : String(err)}`);
        statusText.textContent = "Export failed.";
      } finally {
        if (wakeLock) {
          try { await wakeLock.release(); } catch (_) {}
        }
        isExporting = false;
        previewBtn.disabled = false;
        exportBtn.disabled = false;
      }
    }

    (async () => {
      try {
        await loadFonts();
        buildTimeline();
        tl.time(1.5);
        drawFrame(ctx);
        statusText.textContent = "Ready — click ▶ Preview or ⬇ Export MP4.";
      } catch (err) {
        showError(`Initialization error: ${err.message}`);
      }
    })();

    previewBtn.addEventListener("click", startPreview);
    exportBtn.addEventListener("click", exportMp4);
  </script>
</body>
</html>
