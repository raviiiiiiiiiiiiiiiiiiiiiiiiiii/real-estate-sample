<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

      background: #050B12;
      color: #F6FBFB;
      font-family: 'Plus Jakarta Sans', sans-serif;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      gap: 14px;
    }
    .canvas-wrap {
      position: relative;
      height: min(74vh, 780px);
      aspect-ratio: 9 / 16;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(255, 255, 255, 0.1);
      background: #07121F;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    button, .dl-link {
      appearance: none;
      border: none;
      outline: none;
      font-family: inherit;
      font-weight: 700;
      font-size: 15px;
      padding: 11px 22px;
      border-radius: 999px;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease, background 0.15s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    #previewBtn {
      background: #0FB5AE;
      color: #041E21;
    }
    #exportBtn {
      background: #FF6B5E;
      color: #FFFFFF;
    }
    .dl-link {
      background: #1B3B56;
      color: #F6FBFB;
      border: 1px solid rgba(255,255,255,0.18);
    }
    button:hover:not(:disabled), .dl-link:hover {
      transform: translateY(-1px);
    }
    #statusText {
      font-size: 14px;
      font-weight: 500;
      color: #9BB4C9;
      min-height: 20px;
      text-align: center;
    }
    #errorBox {
      display: none;
      max-width: 560px;
      background: rgba(255, 107, 94, 0.14);
      border: 1px solid #FF6B5E;
      color: #FFD7D3;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 13px;
      text-align: center;
    }
    #resultContainer {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
    }
    #resultVideo {
      width: 180px;
      aspect-ratio: 9 / 16;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.2);
      background: #000;
    }
  </style>
</head>
<body>

  <div class="canvas-wrap">
    <canvas id="stage" width="1080" height="1920"></canvas>
  </div>

  <div class="controls">
    <button id="previewBtn" disabled>▶ Preview</button>
    <button id="exportBtn" disabled>⬇ Export MP4</button>
    <a id="downloadAgain" class="dl-link" style="display:none;" download="dental-booking-promo.mp4">⬇ Download again</a>
  </div>

  <div id="statusText">Loading fonts...</div>
  <div id="errorBox"></div>

  <div id="resultContainer">
    <video id="resultVideo" controls playsinline muted></video>
  </div>

  <script type="module">
    import { Muxer, ArrayBufferTarget } from "https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/+esm";

    // ============================================================================

    // ============================================================================

    // ============================================================================

    const tl = gsap.timeline({ paused: true });

      // Keep state.time synced with playhead

      // Floating chips

      tl.to(state.s7, { chip3: 1, duration: 0.45, ease: "back.out(1.6)" }, 37.54);

      // Exit Scene 7
      tl.to(state.s7, { alpha: 0, h7Alpha: 0, h7Y: -30, laptopY: 100, duration: 0.45, ease: "power2.in" }, 44.55);

      // ---------------- SCENE 8 (45 - 50s) ----------------
      tl.set(state.s8, { alpha: 1 }, 45.0);
      tl.fromTo(state.s8, { h8Alpha: 0, h8Y: 40 }, { h8Alpha: 1, h8Y: 0, duration: 0.6, ease: "power3.out" }, 45.1);

      // ---------------- SCENE 9 (50 - 55s) ----------------

    // ============================================================================
    // CANVAS 2D DRAWING HELPERS
    // ============================================================================
    function roundRectPath(ctx, x, y, w, h, r) {
      const radius = typeof r === "number" ? { tl: r, tr: r, br: r, bl: r } : { tl: 0, tr: 0, br: 0, bl: 0, ...r };
      ctx.beginPath();
      ctx.moveTo(x + radius.tl, y);
      ctx.lineTo(x + w - radius.tr, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + radius.tr);
      ctx.lineTo(x + w, y + h - radius.br);
      ctx.quadraticCurveTo(x + w, y + h, x + w - radius.br, y + h);
      ctx.lineTo(x + radius.bl, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - radius.bl);
      ctx.lineTo(x, y + radius.tl);
      ctx.quadraticCurveTo(x, y, x + radius.tl, y);
      ctx.closePath();
    }

    function fillRoundRect(ctx, x, y, w, h, r, fillStyle) {
      roundRectPath(ctx, x, y, w, h, r);
      ctx.fillStyle = fillStyle;
      ctx.fill();
    }

    function strokeRoundRect(ctx, x, y, w, h, r, strokeStyle, lineWidth = 2) {
      roundRectPath(ctx, x, y, w, h, r);
      ctx.strokeStyle = strokeStyle;
      ctx.lineWidth = lineWidth;
      ctx.stroke();
    }

    /**
     * Wrapped, centered, multi-line text helper with exact phrase/keyword highlighting.
     */
    function drawHighlightedHeadline(ctx, {
      text,
      highlightPhrase = "",
      highlightColor = COLORS.coral,
      baseColor = COLORS.softWhite,
      x = W / 2,
      y = 140,
      maxWidth = W - 160,
      fontSize = 86,
      lineHeight = 1.16,
      fontWeight = 800,
      alpha = 1,
      offsetY = 0
    }) {
      if (alpha <= 0.001) return;
      ctx.save();
      ctx.globalAlpha *= alpha;
      ctx.font = `${fontWeight} ${fontSize}px 'Plus Jakarta Sans', sans-serif`;
      ctx.textBaseline = "top";

      const words = text.split(" ");
      // Mark which word indices belong to highlightPhrase
      const hlWords = highlightPhrase ? highlightPhrase.toLowerCase().split(" ") : [];
      const isHighlighted = new Array(words.length).fill(false);

      if (hlWords.length > 0) {
        for (let i = 0; i <= words.length - hlWords.length; i++) {
          let match = true;
          for (let j = 0; j < hlWords.length; j++) {
            const cleanW = words[i + j].replace(/[^a-zA-Z0-9]/g, "").toLowerCase();
            const cleanH = hlWords[j].replace(/[^a-zA-Z0-9]/g, "").toLowerCase();
            if (cleanW !== cleanH) {
              match = false;
              break;
            }
          }
          if (match) {
            for (let j = 0; j < hlWords.length; j++) isHighlighted[i + j] = true;
          }
        }
      }

      // Wrap into lines (max 3 lines, shrink slightly if needed to respect 80px safe margin)
      const spaceW = ctx.measureText(" ").width;
      const lines = [];
      let currentLine = [];
      let currentW = 0;

      words.forEach((word, idx) => {
        const wWidth = ctx.measureText(word).width;
        const addedW = currentLine.length === 0 ? wWidth : spaceW + wWidth;
        if (currentW + addedW > maxWidth && currentLine.length > 0) {
          lines.push({ tokens: currentLine, width: currentW });
          currentLine = [{ word, hl: isHighlighted[idx], width: wWidth }];
          currentW = wWidth;
        } else {
          currentLine.push({ word, hl: isHighlighted[idx], width: wWidth });
          currentW += addedW;
        }
      });
      if (currentLine.length > 0) {
        lines.push({ tokens: currentLine, width: currentW });
      }

      lines.forEach((line, lineIdx) => {
        let cursorX = x - line.width / 2;
        const lineY = y + offsetY + lineIdx * (fontSize * lineHeight);
        line.tokens.forEach((tok) => {
          ctx.fillStyle = tok.hl ? highlightColor : baseColor;
          ctx.fillText(tok.word, cursorX, lineY);
          cursorX += tok.width + spaceW;
        });
      });

      ctx.restore();
    }

    // Drawn Icons
    function drawToothLogo(ctx, cx, cy, size, color = COLORS.teal) {
      ctx.save();
      ctx.translate(cx, cy);
      const s = size / 100;
      ctx.scale(s, s);
      ctx.beginPath();
      ctx.moveTo(0, -34);
      ctx.bezierCurveTo(-18, -46, -44, -36, -42, -8);
      ctx.bezierCurveTo(-40, 12, -30, 26, -24, 44);
      ctx.bezierCurveTo(-20, 52, -12, 48, -8, 30);

    function drawMiniIcon(ctx, type, cx, cy, r, color) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.lineWidth = 3;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";

      if (type === "clock") {
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, -r * 0.55);
        ctx.lineTo(0, 0);
        ctx.lineTo(r * 0.45, r * 0.25);
        ctx.stroke();
      } else if (type === "check") {
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#FFFFFF";
        ctx.beginPath();
        ctx.moveTo(-r * 0.42, 0);
        ctx.lineTo(-r * 0.1, r * 0.34);
        ctx.lineTo(r * 0.46, -r * 0.32);
        ctx.stroke();
      } else if (type === "calendar") {
        strokeRoundRect(ctx, -r, -r * 0.85, r * 2, r * 1.8, 5, color, 2.8);
        ctx.beginPath();
        ctx.moveTo(-r, -r * 0.25);
        ctx.lineTo(r, -r * 0.25);
        ctx.moveTo(-r * 0.45, -r * 1.1);
        ctx.lineTo(-r * 0.45, -r * 0.6);
        ctx.moveTo(r * 0.45, -r * 1.1);
        ctx.lineTo(r * 0.45, -r * 0.6);
        ctx.stroke();
      } else if (type === "chat") {
        roundRectPath(ctx, -r, -r * 0.85, r * 2, r * 1.55, 8);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(-r * 0.4, -r * 0.08, 2.2, 0, Math.PI * 2);
        ctx.arc(0, -r * 0.08, 2.2, 0, Math.PI * 2);
        ctx.arc(r * 0.4, -r * 0.08, 2.2, 0, Math.PI * 2);
        ctx.fill();
      } else if (type === "user") {
        ctx.beginPath();
        ctx.arc(0, -r * 0.3, r * 0.42, 0, Math.PI * 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(0, r * 0.85, r * 0.78, Math.PI * 1.15, Math.PI * 1.85);
        ctx.stroke();
      } else if (type === "spark") {
        ctx.beginPath();
        ctx.moveTo(0, -r);
        ctx.lineTo(r * 0.28, -r * 0.28);
        ctx.lineTo(r, 0);
        ctx.lineTo(r * 0.28, r * 0.28);
        ctx.lineTo(0, r);
        ctx.lineTo(-r * 0.28, r * 0.28);
        ctx.lineTo(-r, 0);
        ctx.lineTo(-r * 0.28, -r * 0.28);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();
    }

    function drawFloatingChip(ctx, {
      text,
      icon = "check",
      iconColor = COLORS.teal,
      x,
      y,
      progress = 1,
      time = 0,
      phase = 0
    }) {
      if (progress <= 0.001) return;
      ctx.save();
      const bobY = Math.sin(time * 3.1 + phase) * 8;
      const enterY = (1 - progress) * 32;
      ctx.globalAlpha *= Math.min(1, progress);
      ctx.translate(x, y + bobY + enterY);
      const scale = 0.85 + 0.15 * progress;
      ctx.scale(scale, scale);

      ctx.font = "700 27px 'Plus Jakarta Sans', sans-serif";
      const textW = ctx.measureText(text).width;
      const pillW = textW + 96;
      const pillH = 68;

      ctx.shadowColor = "rgba(7, 18, 31, 0.26)";
      ctx.shadowBlur = 26;
      ctx.shadowOffsetY = 10;

      fillRoundRect(ctx, -pillW / 2, -pillH / 2, pillW, pillH, 34, "#FFFFFF");
      ctx.shadowColor = "transparent";
      strokeRoundRect(ctx, -pillW / 2, -pillH / 2, pillW, pillH, 34, "rgba(15, 181, 174, 0.28)", 2);

      // Icon circle
      const iconX = -pillW / 2 + 36;
      ctx.beginPath();
      ctx.arc(iconX, 0, 20, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(15, 181, 174, 0.14)";
      ctx.fill();
      drawMiniIcon(ctx, icon, iconX, 0, 11, iconColor);

      ctx.fillStyle = COLORS.ink;
      ctx.textBaseline = "middle";
      ctx.textAlign = "left";
      ctx.fillText(text, -pillW / 2 + 68, 1);

      ctx.restore();
    }

    function drawPhoneMockup(ctx, { x, y, w, h, tiltDeg = 0, screenBg = "#0E1B26", drawScreen }) {
      ctx.save();
      ctx.translate(x, y);
      if (tiltDeg !== 0) ctx.rotate((tiltDeg * Math.PI) / 180);

      // Outer Soft Shadow
      ctx.shadowColor = "rgba(5, 12, 22, 0.42)";
      ctx.shadowBlur = 55;
      ctx.shadowOffsetY = 26;

      // Dark Bezel (60px rounded corners)
      fillRoundRect(ctx, -w / 2, -h / 2, w, h, 60, "#121D2B");
      ctx.shadowColor = "transparent";
      strokeRoundRect(ctx, -w / 2, -h / 2, w, h, 60, "rgba(255,255,255,0.18)", 4);

      // Inner Screen
      const pad = 18;
      const sx = -w / 2 + pad;
      const sy = -h / 2 + pad;
      const sw = w - pad * 2;
      const sh = h - pad * 2;

      ctx.save();
      roundRectPath(ctx, sx, sy, sw, sh, 46);
      ctx.clip();
      ctx.fillStyle = screenBg;
      ctx.fillRect(sx, sy, sw, sh);

      if (drawScreen) {
        drawScreen(ctx, sx, sy, sw, sh);
      }
      ctx.restore();

      // Top Notch / Dynamic Island
      fillRoundRect(ctx, -86, sy + 14, 172, 32, 16, "#091019");
      ctx.beginPath();
      ctx.arc(54, sy + 30, 6, 0, Math.PI * 2);
      ctx.fillStyle = "#1D3557";
      ctx.fill();

      ctx.restore();
    }

    // ============================================================================
    // REAL-TIME PREVIEW LOOP
    // ============================================================================
    let isPreviewing = false;
    let previewRaf = null;
    let previewStartPerf = 0;

    function stopPreview() {
      isPreviewing = false;
      if (previewRaf) cancelAnimationFrame(previewRaf);
      previewRaf = null;
      previewBtn.textContent = "▶ Preview";
    }

    function startPreview() {
      if (isPreviewing) {
        stopPreview();
        statusText.textContent = `Paused at ${tl.time().toFixed(1)}s / ${DURATION}s`;
        return;
      }
      isPreviewing = true;
      previewBtn.textContent = "⏸ Pause";
      const startOffset = tl.time() >= DURATION - 0.05 ? 0 : tl.time();
      previewStartPerf = performance.now() - startOffset * 1000;

      const tick = (now) => {
        if (!isPreviewing) return;
        const elapsed = (now - previewStartPerf) / 1000;
        if (elapsed >= DURATION) {
          tl.time(DURATION);
          drawFrame(ctx);
          stopPreview();
          statusText.textContent = "Preview complete (55.0s)";
          return;
        }
        tl.time(elapsed);
        drawFrame(ctx);
        statusText.textContent = `Previewing ${elapsed.toFixed(1)}s / ${DURATION}.0s`;
        previewRaf = requestAnimationFrame(tick);
      };
      previewRaf = requestAnimationFrame(tick);
    }

    // ============================================================================
    // MP4 EXPORT (WEBCODECS + MP4-MUXER WITH MEDIARECORDER FALLBACK)
    // ============================================================================
    async function acquireWakeLock() {
      try {
        if ("wakeLock" in navigator) {
          return await navigator.wakeLock.request("screen");
        }
      } catch (_) {}
      return null;
    }

    function presentExportResult(blob, ext = "mp4", isFallback = false) {
      const url = URL.createObjectURL(blob);
      const filename = `dental-booking-promo.${ext}`;

      const tempLink = document.createElement("a");
      tempLink.href = url;
      tempLink.download = filename;
      document.body.appendChild(tempLink);
      tempLink.click();
      tempLink.remove();

      downloadAgain.href = url;
      downloadAgain.download = filename;
      downloadAgain.style.display = "inline-flex";

      resultVideo.src = url;
      resultContainer.style.display = "flex";

      statusText.textContent = isFallback
        ? `Export complete (MediaRecorder fallback: ${filename})`
        : "Export complete! Downloaded dental-booking-promo.mp4";
    }

    async function exportWithFallback() {
      statusText.textContent = "WebCodecs unavailable — using real-time MediaRecorder fallback (55s)...";
      const stream = canvas.captureStream(FPS);
      const mimeTypes = [
        "video/mp4;codecs=avc1",
        "video/mp4",
        "video/webm;codecs=vp9",
        "video/webm"
      ];
      const chosenMime = mimeTypes.find((m) => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || "";
      const recorder = chosenMime
        ? new MediaRecorder(stream, { mimeType: chosenMime, videoBitsPerSecond: 8_000_000 })
        : new MediaRecorder(stream);

      const chunks = [];
      recorder.ondataavailable = (e) => {
        if (e.data && e.data.size > 0) chunks.push(e.data);
      };

      return new Promise((resolve, reject) => {
        recorder.onerror = (err) => reject(err.error || new Error("MediaRecorder failed"));
        recorder.onstop = () => {
          const isMp4 = chosenMime.includes("mp4");
          const blob = new Blob(chunks, { type: isMp4 ? "video/mp4" : "video/webm" });
          presentExportResult(blob, isMp4 ? "mp4" : "webm", true);
          resolve();
        };

        recorder.start(200);
        const startPerf = performance.now();

        const step = (now) => {
          const elapsed = (now - startPerf) / 1000;
          const clamped = Math.min(DURATION, elapsed);
          tl.time(clamped);
          drawFrame(ctx);
          const pct = Math.min(100, Math.round((clamped / DURATION) * 100));
          statusText.textContent = `Fallback recording ${pct}% (real-time)...`;
          if (elapsed < DURATION) {
            requestAnimationFrame(step);
          } else {
            recorder.stop();
          }
        };
        requestAnimationFrame(step);
      });
    }

    async function exportMp4() {
      stopPreview();
      errorBox.style.display = "none";
      previewBtn.disabled = true;
      exportBtn.disabled = true;

      const wakeLock = await acquireWakeLock();

      try {
        if (typeof VideoEncoder === "undefined" || typeof VideoFrame === "undefined") {
          await exportWithFallback();
          return;
        }

        // Check codec support with exact fallback chain
        const candidateCodecs = ["avc1.64002A", "avc1.640028", "avc1.4D0028"];
        let chosenConfig = null;

        for (const codec of candidateCodecs) {
          const cfg = {
            codec,
            width: W,
            height: H,
            bitrate: 8_000_000,
            framerate: FPS
          };
          try {
            const support = await VideoEncoder.isConfigSupported(cfg);
            if (support && support.supported) {
              chosenConfig = support.config || cfg;
              break;
            }
          } catch (_) {}
        }

        if (!chosenConfig) {
          await exportWithFallback();
          return;
        }

        const muxer = new Muxer({
          target: new ArrayBufferTarget(),
          video: {
            codec: "avc",
            width: W,
            height: H
          },
          fastStart: "in-memory"
        });

        let encoderFailure = null;
        const encoder = new VideoEncoder({
          output: (chunk, meta) => {
            muxer.addVideoChunk(chunk, meta);
          },
          error: (err) => {
            encoderFailure = err;
          }
        });

        encoder.configure(chosenConfig);

        const frameDurationUs = Math.round(1e6 / FPS);

        for (let i = 0; i < TOTAL_FRAMES; i++) {
          if (encoderFailure) throw encoderFailure;

          tl.time(i / FPS);
          drawFrame(ctx);

          const timestampUs = Math.round((i * 1e6) / FPS);
          const frame = new VideoFrame(canvas, {
            timestamp: timestampUs,
            duration: frameDurationUs
          });

          encoder.encode(frame, { keyFrame: i % 30 === 0 });
          frame.close();

          // Respect encoder backpressure
          while (encoder.encodeQueueSize > 8) {
            if (encoderFailure) throw encoderFailure;
            await new Promise((r) => setTimeout(r, 4));
          }

          if (i % 10 === 0 || i === TOTAL_FRAMES - 1) {
            const pct = Math.round(((i + 1) / TOTAL_FRAMES) * 100);
            statusText.textContent = `Exporting ${pct}%`;
            await new Promise((r) => setTimeout(r, 0));
          }
        }

        statusText.textContent = "Finalizing MP4...";
        await encoder.flush();
        if (encoderFailure) throw encoderFailure;
        encoder.close();

        muxer.finalize();
        const { buffer } = muxer.target;
        const blob = new Blob([buffer], { type: "video/mp4" });
        presentExportResult(blob, "mp4", false);
      } catch (err) {
        showError(`Export failed: ${err && err.message ? err.message : String(err)}`);
        statusText.textContent = "Export encountered an error.";
      } finally {
        if (wakeLock) {
          try { await wakeLock.release(); } catch (_) {}
        }
        previewBtn.disabled = false;
        exportBtn.disabled = false;
      }
    }

    // ============================================================================
    // INITIALIZATION (AWAIT FONTS BEFORE ANY DRAWING OR EXPORT)
    // ============================================================================
    async function init() {
      try {
        await Promise.all([
          document.fonts.load("500 32px 'Plus Jakarta Sans'"),
          document.fonts.load("700 32px 'Plus Jakarta Sans'"),
          document.fonts.load("800 64px 'Plus Jakarta Sans'")
        ]);
        await document.fonts.ready;

        buildTimeline();
        tl.time(0);
        drawFrame(ctx);

        previewBtn.disabled = false;
        exportBtn.disabled = false;
        statusText.textContent = "Ready • 55s Vertical 1080×1920 @ 30fps";

        previewBtn.addEventListener("click", startPreview);
        exportBtn.addEventListener("click", exportMp4);
      } catch (err) {
        showError(`Initialization failed: ${err && err.message ? err.message : String(err)}`);
      }
    }

    init();
  </script>
</body>
</html>
