  <script type="module">
    import { Muxer, ArrayBufferTarget } from "https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/+esm";

    // SOUND EFFECTS CUE LIST (synced exactly with timeline)

      // SCENE 1 (0 - 4s)

    // WEB AUDIO SYNTHESIS (shared between Preview and Offline Export)
    function createNoiseBuffer(ctx, durationSec) {
      const len = Math.ceil(ctx.sampleRate * durationSec);
      const buf = ctx.createBuffer(1, len, ctx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < len; i++) {
        // Deterministic pseudo-random noise so preview and export match
        const x = Math.sin(i * 12.9898 + 78.233) * 43758.5453;
        data[i] = (x - Math.floor(x)) * 2 - 1;
      }
      return buf;
    }

    function createMasterChain(ctx) {
      const comp = ctx.createDynamicsCompressor();
      comp.threshold.setValueAtTime(-14, 0);
      comp.knee.setValueAtTime(10, 0);
      comp.ratio.setValueAtTime(8, 0);
      comp.attack.setValueAtTime(0.003, 0);
      comp.release.setValueAtTime(0.15, 0);

      const master = ctx.createGain();
      master.gain.setValueAtTime(0.25, 0);

      master.connect(comp);
      comp.connect(ctx.destination);
      return master;
    }

    function scheduleCue(ctx, dest, type, t) {
      const eps = 0.0001;
      if (type === "whoosh") {
        const dur = 0.35;
        const src = ctx.createBufferSource();
        src.buffer = createNoiseBuffer(ctx, dur);
        const filter = ctx.createBiquadFilter();
        filter.type = "bandpass";
        filter.Q.setValueAtTime(2.2, t);
        filter.frequency.setValueAtTime(400, t);
        filter.frequency.exponentialRampToValueAtTime(2500, t + dur);

        const g = ctx.createGain();
        g.gain.setValueAtTime(eps, t);
        g.gain.linearRampToValueAtTime(0.45, t + 0.06);
        g.gain.exponentialRampToValueAtTime(eps, t + dur);

        src.connect(filter).connect(g).connect(dest);
        src.start(t);
        src.stop(t + dur);
      } else if (type === "pop") {
        const dur = 0.12;
        const osc = ctx.createOscillator();
        osc.type = "sine";
        osc.frequency.setValueAtTime(700, t);
        osc.frequency.exponentialRampToValueAtTime(250, t + dur);

        const g = ctx.createGain();
        g.gain.setValueAtTime(eps, t);
        g.gain.linearRampToValueAtTime(0.55, t + 0.012);
        g.gain.exponentialRampToValueAtTime(eps, t + dur);

        osc.connect(g).connect(dest);
        osc.start(t);
        osc.stop(t + dur);
      } else if (type === "tick") {
        const dur = 0.05;
        const osc = ctx.createOscillator();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(1200, t);

        const g = ctx.createGain();
        g.gain.setValueAtTime(eps, t);
        g.gain.linearRampToValueAtTime(0.4, t + 0.005);
        g.gain.exponentialRampToValueAtTime(eps, t + dur);

        osc.connect(g).connect(dest);
        osc.start(t);
        osc.stop(t + dur);
      } else if (type === "slide") {
        const dur = 0.2;
        const src = ctx.createBufferSource();
        src.buffer = createNoiseBuffer(ctx, dur);
        const filter = ctx.createBiquadFilter();
        filter.type = "bandpass";
        filter.Q.setValueAtTime(3.0, t);
        filter.frequency.setValueAtTime(600, t);
        filter.frequency.exponentialRampToValueAtTime(1600, t + dur);

        const g = ctx.createGain();
        g.gain.setValueAtTime(eps, t);
        g.gain.linearRampToValueAtTime(0.24, t + 0.03);
        g.gain.exponentialRampToValueAtTime(eps, t + dur);

        src.connect(filter).connect(g).connect(dest);
        src.start(t);
        src.stop(t + dur);
      } else if (type === "empty-ping") {
        const notes = [
          { f: 520, start: 0, dur: 0.16 },
          { f: 390, start: 0.14, dur: 0.21 }
        ];
        for (const n of notes) {
          const st = t + n.start;
          const osc = ctx.createOscillator();
          osc.type = "sine";
          osc.frequency.setValueAtTime(n.f, st);

          const g = ctx.createGain();
          g.gain.setValueAtTime(eps, st);
          g.gain.linearRampToValueAtTime(0.42, st + 0.012);
          g.gain.exponentialRampToValueAtTime(eps, st + n.dur);

          osc.connect(g).connect(dest);
          osc.start(st);
          osc.stop(st + n.dur);
        }
      } else if (type === "soft-thud") {
        const dur = 0.25;
        const osc = ctx.createOscillator();
        osc.type = "sine";
        osc.frequency.setValueAtTime(110, t);
        osc.frequency.exponentialRampToValueAtTime(60, t + dur);

        const g = ctx.createGain();
        g.gain.setValueAtTime(eps, t);
        g.gain.linearRampToValueAtTime(0.45, t + 0.015);
        g.gain.exponentialRampToValueAtTime(eps, t + dur);

        osc.connect(g).connect(dest);
        osc.start(t);
        osc.stop(t + dur);
      } else if (type === "final-chime") {
        const freqs = [660, 880, 1320];
        freqs.forEach((f, idx) => {
          const st = t + idx * 0.09;
          const dur = 0.8;
          const osc = ctx.createOscillator();
          osc.type = "sine";
          osc.frequency.setValueAtTime(f, st);

          const g = ctx.createGain();
          g.gain.setValueAtTime(eps, st);
          g.gain.linearRampToValueAtTime(0.32, st + 0.015);
          g.gain.exponentialRampToValueAtTime(eps, st + dur);

          osc.connect(g).connect(dest);
          osc.start(st);
          osc.stop(st + dur);
        });
      }
    }

    function scheduleAllCues(ctx, baseTime = 0, extraDest = null) {
      const master = createMasterChain(ctx);
      if (extraDest) {
        master.connect(extraDest);
      }
      for (const cue of SFX_CUES) {
        scheduleCue(ctx, master, cue.type, baseTime + cue.t);
      }
      return master;
    }

    // DETERMINISTIC ANIMATION STATE
    const state = {
      bgLightMix: 0,
      bgFinalMix: 0,
      s1: {
        alpha: 0, chipAlpha: 0, chipScale: 0.8,
        headY: 40, headAlpha: 0,
        winScale: 0.9, winAlpha: 0,

      },

    // GSAP MASTER TIMELINE (exactly 22.0s)
    const tl = gsap.timeline({ paused: true });

    function buildTimeline() {
      tl.clear();

      // Anchor timeline duration to exactly 22s
      tl.set(state, { bgLightMix: 0, bgFinalMix: 0 }, 0);

      // SCENE 1 (0 - 4s)
      tl.set(state.s1, { alpha: 1 }, 0);
      tl.fromTo(state.s1, { headY: 40, headAlpha: 0 }, { headY: 0, headAlpha: 1, duration: 0.45, ease: "power3.out" }, 0.2);
      tl.fromTo(state.s1, { chipAlpha: 0, chipScale: 0.8 }, { chipAlpha: 1, chipScale: 1, duration: 0.3, ease: "back.out(1.7)" }, 0.5);
      tl.fromTo(state.s1, { winScale: 0.9, winAlpha: 0 }, { winScale: 1, winAlpha: 1, duration: 0.45, ease: "back.out(1.4)" }, 0.9);
      tl.fromTo(state.s1, { arrowAlpha: 0, arrowX: 0 }, { arrowAlpha: 1, arrowX: 165, duration: 0.55, ease: "power2.out" }, 1.8);
      tl.to(state.s1, { arrowAlpha: 0.3, duration: 0.4, ease: "power1.inOut" }, 2.4);
      tl.to(state.s1, { alpha: 0, duration: 0.3, ease: "power2.in" }, 3.7);

      // SCENE 2 (4 - 8s)

      tl.fromTo(state.s2, { headY: 40, headAlpha: 0 }, { headY: 0, headAlpha: 1, duration: 0.45, ease: "power3.out" }, 4.0);
      tl.fromTo(state.s2, { chipAlpha: 0, chipScale: 0.8 }, { chipAlpha: 1, chipScale: 1, duration: 0.3, ease: "back.out(1.7)" }, 4.4);
      tl.fromTo(state.s2, { phoneY: 60, phoneAlpha: 0 }, { phoneY: 0, phoneAlpha: 1, duration: 0.45, ease: "power3.out" }, 4.8);
      tl.fromTo(state.s2, { b1Alpha: 0, b1X: -40 }, { b1Alpha: 1, b1X: 0, duration: 0.25, ease: "power2.out" }, 5.4);
      tl.fromTo(state.s2, { b2Alpha: 0, b2X: -40 }, { b2Alpha: 1, b2X: 0, duration: 0.25, ease: "power2.out" }, 5.7);
      tl.fromTo(state.s2, { b3Alpha: 0, b3X: -40 }, { b3Alpha: 1, b3X: 0, duration: 0.25, ease: "power2.out" }, 6.0);
      tl.fromTo(state.s2, { magAlpha: 0, magT: 0 }, { magAlpha: 1, magT: 1, duration: 1.4, ease: "power1.inOut" }, 5.3);
      tl.fromTo(state.s2, { circleAlpha: 0, circleScale: 1.35 }, { circleAlpha: 1, circleScale: 1, duration: 0.35, ease: "back.out(1.7)" }, 6.8);
      tl.to(state.s2, { alpha: 0, duration: 0.3, ease: "power2.in" }, 7.7);

      // SCENE 3 (8 - 12s) - Transition background from Navy to Soft White
      tl.to(state, { bgLightMix: 1, duration: 0.45, ease: "power2.inOut" }, 7.85);
      tl.set(state.s3, { alpha: 1 }, 8.0);

      tl.fromTo(state.s3, { chipAlpha: 0, chipScale: 0.8 }, { chipAlpha: 1, chipScale: 1, duration: 0.3, ease: "back.out(1.7)" }, 8.4);
      tl.fromTo(state.s3, { phoneY: 60, phoneAlpha: 0 }, { phoneY: 0, phoneAlpha: 1, duration: 0.45, ease: "power3.out" }, 8.8);
      tl.fromTo(state.s3, { spinAngle: 0 }, { spinAngle: Math.PI * 6, duration: 2.5, ease: "none" }, 8.8);
      tl.to(state.s3, { loadProgress: 0.20, duration: 0.12, ease: "power2.out" }, 9.3);
      tl.to(state.s3, { loadProgress: 0.25, duration: 0.12, ease: "power2.out" }, 9.6);
      tl.to(state.s3, { loadProgress: 0.29, duration: 0.12, ease: "power2.out" }, 9.9);
      tl.to(state.s3, { loadProgress: 0.32, duration: 0.12, ease: "power2.out" }, 10.2);
      tl.fromTo(state.s3, { breakProgress: 0, badgeScale: 0 }, { breakProgress: 1, badgeScale: 1, duration: 0.35, ease: "back.out(1.6)" }, 11.3);
      tl.to(state.s3, { alpha: 0, duration: 0.3, ease: "power2.in" }, 11.7);

      // SCENE 4 (12 - 16s) - Light Soft White
      tl.set(state.s4, { alpha: 1 }, 12.0);
      tl.fromTo(state.s4, { headY: 40, headAlpha: 0 }, { headY: 0, headAlpha: 1, duration: 0.45, ease: "power3.out" }, 12.0);
      tl.fromTo(state.s4, { chipAlpha: 0, chipScale: 0.8 }, { chipAlpha: 1, chipScale: 1, duration: 0.3, ease: "back.out(1.7)" }, 12.4);
      tl.fromTo(state.s4, { cardY: 50, cardAlpha: 0 }, { cardY: 0, cardAlpha: 1, duration: 0.45, ease: "power3.out" }, 12.8);
      tl.fromTo(state.s4, { r1Alpha: 0, r1X: -50 }, { r1Alpha: 1, r1X: 0, duration: 0.25, ease: "power2.out" }, 13.3);
      tl.fromTo(state.s4, { r2Alpha: 0, r2X: -50 }, { r2Alpha: 1, r2X: 0, duration: 0.25, ease: "power2.out" }, 13.6);
      tl.fromTo(state.s4, { r3Alpha: 0, r3X: -50 }, { r3Alpha: 1, r3X: 0, duration: 0.25, ease: "power2.out" }, 13.9);
      tl.fromTo(state.s4, { bubbleScale: 0, bubbleAlpha: 0 }, { bubbleScale: 1, bubbleAlpha: 1, duration: 0.38, ease: "back.out(1.7)" }, 14.6);
      tl.to(state.s4, { alpha: 0, duration: 0.3, ease: "power2.in" }, 15.7);

      // SCENE 5 (16 - 22s) - Teal-to-Blue Gradient
      tl.to(state, { bgFinalMix: 1, duration: 0.45, ease: "power2.inOut" }, 15.85);
      tl.set(state.s5, { alpha: 1 }, 16.0);
      tl.fromTo(state.s5, { headY: 40, headAlpha: 0 }, { headY: 0, headAlpha: 1, duration: 0.45, ease: "power3.out" }, 16.0);
      tl.fromTo(state.s5, { logoScale: 0.8, logoAlpha: 0 }, { logoScale: 1, logoAlpha: 1, duration: 0.45, ease: "back.out(1.5)" }, 16.8);
      tl.fromTo(state.s5, { subAlpha: 0, subY: 25 }, { subAlpha: 1, subY: 0, duration: 0.35, ease: "power2.out" }, 18.4);
      tl.fromTo(state.s5, { btnScale: 0.8, btnAlpha: 0, contactAlpha: 0 }, { btnScale: 1, btnAlpha: 1, contactAlpha: 1, duration: 0.4, ease: "back.out(1.6)" }, 19.6);
      tl.fromTo(state.s5, { btnPulse: 0 }, { btnPulse: Math.PI * 3, duration: 2.2, ease: "sine.inOut" }, 19.8);

      // Hold until exactly DURATION
      tl.set({}, {}, DURATION);
    }

    // DRAWING HELPERS
    function lerpColor(hexA, hexB, t) {
      const a = parseInt(hexA.slice(1), 16);
      const b = parseInt(hexB.slice(1), 16);
      const r1 = (a >> 16) & 255, g1 = (a >> 8) & 255, b1 = a & 255;
      const r2 = (b >> 16) & 255, g2 = (b >> 8) & 255, b2 = b & 255;
      const r = Math.round(r1 + (r2 - r1) * t);
      const g = Math.round(g1 + (g2 - g1) * t);
      const bl = Math.round(b1 + (b2 - b1) * t);
      return `rgb(${r},${g},${bl})`;
    }

    function roundRect(ctx, x, y, w, h, r) {
      const radius = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.arcTo(x + w, y, x + w, y + h, radius);
      ctx.arcTo(x + w, y + h, x, y + h, radius);
      ctx.arcTo(x, y + h, x, y, radius);
      ctx.arcTo(x, y, x + w, y, radius);
      ctx.closePath();
    }

    /**
     * Multi-line centered headline helper with exact phrase highlighting.
     * Safe box center X = 510 (inside x: 80..940).
     */
    function drawHeadline(ctx, lines, highlightPhrase, centerX, startY, fontSize, baseColor, highlightColor) {
      ctx.save();
      ctx.font = `800 ${fontSize}px 'Plus Jakarta Sans', sans-serif`;
      ctx.textBaseline = "top";
      const lineHeight = fontSize * 1.15;
      const hlWords = highlightPhrase ? highlightPhrase.toLowerCase().split(" ") : [];

      lines.forEach((lineText, idx) => {
        const words = lineText.split(" ");
        const cleanWords = words.map(w => w.replace(/[^a-zA-Z0-9]/g, "").toLowerCase());
        const isHighlighted = new Array(words.length).fill(false);

        if (hlWords.length > 0) {
          for (let i = 0; i <= cleanWords.length - hlWords.length; i++) {
            let match = true;
            for (let j = 0; j < hlWords.length; j++) {
              if (cleanWords[i + j] !== hlWords[j]) { match = false; break; }
            }
            if (match) {
              for (let j = 0; j < hlWords.length; j++) isHighlighted[i + j] = true;
            }
          }
        }

        const spaceW = ctx.measureText(" ").width;
        const widths = words.map(w => ctx.measureText(w).width);
        const totalW = widths.reduce((a, b) => a + b, 0) + spaceW * (words.length - 1);

        let curX = centerX - totalW / 2;
        const y = startY + idx * lineHeight;

        words.forEach((w, wIdx) => {
          ctx.fillStyle = isHighlighted[wIdx] ? highlightColor : baseColor;
          ctx.fillText(w, curX, y);
          curX += widths[wIdx] + spaceW;
        });
      });
      ctx.restore();
    }

    function drawChip(ctx, text, centerX, y, bg, textColor, alpha, scale) {
      if (alpha <= 0.001) return;
      ctx.save();
      ctx.globalAlpha *= alpha;
      ctx.translate(centerX, y + 34);
      ctx.scale(scale, scale);

      ctx.font = "700 40px 'Plus Jakarta Sans', sans-serif";
      const tw = ctx.measureText(text).width;
      const pw = tw + 56;
      const ph = 68;

      roundRect(ctx, -pw / 2, -ph / 2, pw, ph, 34);

      ctx.fillStyle = textColor;

    function drawPhoneShell(ctx, cx, cy, w, h, clipContentFn) {
      const x = cx - w / 2;
      const y = cy - h / 2;

      // Shadow + outer dark bezel
      ctx.save();
      ctx.shadowColor = "rgba(7, 18, 31, 0.25)";
      ctx.shadowBlur = 40;
      ctx.shadowOffsetY = 18;
      roundRect(ctx, x, y, w, h, 60);
      ctx.fillStyle = "#102133";
      ctx.fill();
      ctx.restore();

      // Inner screen
      const pad = 16;
      const sx = x + pad, sy = y + pad, sw = w - pad * 2, sh = h - pad * 2;
      roundRect(ctx, sx, sy, sw, sh, 46);
      ctx.fillStyle = "#FFFFFF";
      ctx.fill();

      if (clipContentFn) {
        ctx.save();
        roundRect(ctx, sx, sy, sw, sh, 46);
        ctx.clip();
        clipContentFn(sx, sy, sw, sh);
        ctx.restore();
      }

      // Top notch
      roundRect(ctx, cx - 70, y + 26, 140, 22, 11);
      ctx.fillStyle = "#102133";
      ctx.fill();
    }

    // MAIN DRAW FUNCTION (Pure function of `state`)
    function drawFrame(ctx) {
      ctx.clearRect(0, 0, WIDTH, HEIGHT);

      // =====================================================

      if (state.s5.alpha > 0.001) {

    // INITIALIZATION & FONT LOADING
    const canvas = document.getElementById("reelCanvas");
    const ctx = canvas.getContext("2d");
    const previewBtn = document.getElementById("previewBtn");
    const exportBtn = document.getElementById("exportBtn");
    const statusEl = document.getElementById("status");
    const errorBox = document.getElementById("errorBox");
    const resultArea = document.getElementById("resultArea");
    const downloadLink = document.getElementById("downloadLink");
    const resultVideo = document.getElementById("resultVideo");

    function showError(msg) {
      errorBox.style.display = "block";
      errorBox.textContent = msg;
    }

    function clearError() {
      errorBox.style.display = "none";
      errorBox.textContent = "";
    }

    async function ensureFontsReady() {
      await Promise.all([
        document.fonts.load("500 48px 'Plus Jakarta Sans'"),
        document.fonts.load("700 48px 'Plus Jakarta Sans'"),
        document.fonts.load("800 92px 'Plus Jakarta Sans'")
      ]);
      await document.fonts.ready;
    }

    let previewAudioCtx = null;
    let previewRafId = null;

    function stopPreview() {
      if (previewRafId) {
        cancelAnimationFrame(previewRafId);
        previewRafId = null;
      }
      if (previewAudioCtx) {
        previewAudioCtx.close().catch(() => {});
        previewAudioCtx = null;
      }
    }

    async function startPreview() {
      clearError();
      stopPreview();
      await ensureFontsReady();

      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      previewAudioCtx = new AudioCtx();
      if (previewAudioCtx.state === "suspended") {
        await previewAudioCtx.resume();
      }

      const startTime = previewAudioCtx.currentTime + 0.05;
      scheduleAllCues(previewAudioCtx, startTime);

      statusEl.textContent = "Previewing...";

      const tick = () => {
        if (!previewAudioCtx) return;
        const elapsed = Math.max(0, previewAudioCtx.currentTime - startTime);
        if (elapsed >= DURATION) {
          tl.time(DURATION);
          drawFrame(ctx);
          statusEl.textContent = "Preview complete (22.0s)";
          stopPreview();
          return;
        }
        tl.time(elapsed);
        drawFrame(ctx);
        statusEl.textContent = `Previewing ${elapsed.toFixed(1)}s / ${DURATION}s`;
        previewRafId = requestAnimationFrame(tick);
      };

      previewRafId = requestAnimationFrame(tick);
    }

    // FALLBACK REALTIME RECORDER (if WebCodecs VideoEncoder is unavailable)
    async function exportFallbackMediaRecorder() {
      statusEl.textContent = "WebCodecs unavailable — using real-time MediaRecorder fallback...";
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      const recAudioCtx = new AudioCtx();
      if (recAudioCtx.state === "suspended") await recAudioCtx.resume();

      const destNode = recAudioCtx.createMediaStreamDestination();
      const startTime = recAudioCtx.currentTime + 0.05;
      scheduleAllCues(recAudioCtx, startTime, destNode);

      const canvasStream = canvas.captureStream(FPS);
      const combined = new MediaStream([
        ...canvasStream.getVideoTracks(),
        ...destNode.stream.getAudioTracks()
      ]);

      const mime = MediaRecorder.isTypeSupported("video/mp4")
        ? "video/mp4"
        : "video/webm";
      const recorder = new MediaRecorder(combined, { mimeType: mime, videoBitsPerSecond: 8_000_000 });
      const chunks = [];
      recorder.ondataavailable = e => { if (e.data && e.data.size > 0) chunks.push(e.data); };

      return new Promise((resolve, reject) => {
        recorder.onerror = e => reject(e.error || new Error("MediaRecorder error"));
        recorder.onstop = () => {
          recAudioCtx.close().catch(() => {});
          const blob = new Blob(chunks, { type: mime });
          resolve({ blob, note: "Exported with MediaRecorder real-time fallback." });
        };
        recorder.start();

        const step = () => {
          const elapsed = Math.max(0, recAudioCtx.currentTime - startTime);
          if (elapsed >= DURATION) {
            tl.time(DURATION);
            drawFrame(ctx);
            recorder.stop();
            return;
          }
          tl.time(elapsed);
          drawFrame(ctx);
          const pct = Math.min(99, Math.round((elapsed / DURATION) * 100));
          statusEl.textContent = `Exporting (real-time fallback) ${pct}%`;
          requestAnimationFrame(step);
        };
        requestAnimationFrame(step);
      });
    }

    // MAIN WEBCODECS OFFLINE EXPORT
    async function exportMP4() {
      clearError();
      stopPreview();
      previewBtn.disabled = true;
      exportBtn.disabled = true;
      resultArea.style.display = "none";

      let wakeLock = null;
      try {
        if ("wakeLock" in navigator) {
          wakeLock = await navigator.wakeLock.request("screen").catch(() => null);
        }

        await ensureFontsReady();

        if (typeof VideoEncoder === "undefined") {
          const { blob, note } = await exportFallbackMediaRecorder();
          finishDownload(blob, note);
          return;
        }

        statusEl.textContent = "Rendering offline audio...";

        // 1) Render SFX with OfflineAudioContext (stereo, 44100 Hz, DURATION seconds)
        const sampleRate = 44100;
        const totalSamples = sampleRate * DURATION;
        const offlineCtx = new OfflineAudioContext(2, totalSamples, sampleRate);
        scheduleAllCues(offlineCtx, 0);
        const audioBuffer = await offlineCtx.startRendering();

        // 2) Check VideoEncoder codec support
        const candidateCodecs = ["avc1.64002A", "avc1.640028", "avc1.4D0028"];
        let selectedVideoConfig = null;
        for (const c of candidateCodecs) {
          const cfg = {
            codec: c,
            width: WIDTH,
            height: HEIGHT,
            framerate: FPS,
            bitrate: 8_000_000
          };
          const res = await VideoEncoder.isConfigSupported(cfg);
          if (res.supported) {
            selectedVideoConfig = cfg;
            break;
          }
        }
        if (!selectedVideoConfig) {
          throw new Error("No supported H.264 VideoEncoder configuration found in this browser.");
        }

        // 3) Check AudioEncoder support
        let hasAudioEncoder = false;
        const audioConfig = {
          codec: "mp4a.40.2",
          sampleRate: 44100,
          numberOfChannels: 2,
          bitrate: 128000
        };
        if (typeof AudioEncoder !== "undefined") {
          try {
            const aRes = await AudioEncoder.isConfigSupported(audioConfig);
            hasAudioEncoder = Boolean(aRes && aRes.supported);
          } catch {
            hasAudioEncoder = false;
          }
        }

        // 4) Configure mp4-muxer
        const muxerOpts = {
          target: new ArrayBufferTarget(),
          video: {
            codec: "avc",
            width: WIDTH,
            height: HEIGHT
          },
          fastStart: "in-memory"
        };
        if (hasAudioEncoder) {
          muxerOpts.audio = {
            codec: "aac",
            numberOfChannels: 2,
            sampleRate: 44100
          };
        }
        const muxer = new Muxer(muxerOpts);

        let encoderError = null;
        const videoEncoder = new VideoEncoder({
          output: (chunk, meta) => muxer.addVideoChunk(chunk, meta),
          error: err => { encoderError = err; }
        });
        videoEncoder.configure(selectedVideoConfig);

        let audioEncoder = null;
        if (hasAudioEncoder) {
          audioEncoder = new AudioEncoder({
            output: (chunk, meta) => muxer.addAudioChunk(chunk, meta),
            error: err => { encoderError = err; }
          });
          audioEncoder.configure(audioConfig);

          // Feed AudioData in chunks of 1024 frames (f32-planar)
          const ch0 = audioBuffer.getChannelData(0);
          const ch1 = audioBuffer.getChannelData(1);
          const chunkFrames = 1024;
          for (let offset = 0; offset < totalSamples; offset += chunkFrames) {
            if (encoderError) throw encoderError;
            const frameCount = Math.min(chunkFrames, totalSamples - offset);
            const planar = new Float32Array(frameCount * 2);
            planar.set(ch0.subarray(offset, offset + frameCount), 0);
            planar.set(ch1.subarray(offset, offset + frameCount), frameCount);

            const timestampUs = Math.round((offset / sampleRate) * 1e6);
            const audioData = new AudioData({
              format: "f32-planar",
              sampleRate,
              numberOfFrames: frameCount,
              numberOfChannels: 2,
              timestamp: timestampUs,
              data: planar
            });
            audioEncoder.encode(audioData);
            audioData.close();
          }
        }

        // 5) Encode Video Frames 0 .. DURATION*FPS - 1
        const totalFrames = DURATION * FPS;
        const frameDurationUs = Math.round(1e6 / FPS);

        for (let i = 0; i < totalFrames; i++) {
          if (encoderError) throw encoderError;

          tl.time(i / FPS);
          drawFrame(ctx);

          const timestampUs = Math.round((i * 1e6) / FPS);
          const vf = new VideoFrame(canvas, {
            timestamp: timestampUs,
            duration: frameDurationUs
          });
          videoEncoder.encode(vf, { keyFrame: i % 30 === 0 });
          vf.close();

          // Respect encoder backpressure
          while (videoEncoder.encodeQueueSize > 8) {
            if (encoderError) throw encoderError;
            await new Promise(r => setTimeout(r, 4));
          }

          if (i % 10 === 0 || i === totalFrames - 1) {
            const pct = Math.round(((i + 1) / totalFrames) * 100);
            statusEl.textContent = `Exporting ${pct}%`;
            await new Promise(r => setTimeout(r, 0));
          }
        }

        // 6) Flush & Finalize
        await videoEncoder.flush();
        videoEncoder.close();

        if (audioEncoder) {
          await audioEncoder.flush();
          audioEncoder.close();
        }
        if (encoderError) throw encoderError;

        muxer.finalize();
        const { buffer } = muxer.target;
        const blob = new Blob([buffer], { type: "video/mp4" });

        const note = hasAudioEncoder
          ? "Export complete! MP4 downloaded with audio."
          : "Export complete (video only — AudioEncoder AAC unsupported in this browser).";
        finishDownload(blob, note);
      } catch (err) {
        console.error(err);
        showError(`Export failed: ${err && err.message ? err.message : String(err)}`);
        statusEl.textContent = "Export encountered an error.";
      } finally {
        if (wakeLock) {
          wakeLock.release().catch(() => {});
        }
        previewBtn.disabled = false;
        exportBtn.disabled = false;
      }
    }

    function finishDownload(blob, statusMessage) {
      const url = URL.createObjectURL(blob);
      downloadLink.href = url;
      resultVideo.src = url;
      resultArea.style.display = "flex";
      statusEl.textContent = statusMessage;

      const tempA = document.createElement("a");
      tempA.href = url;
      tempA.download = "ezsites-3-mistakes-reel.mp4";
      document.body.appendChild(tempA);
      tempA.click();
      tempA.remove();
    }

    // BOOTSTRAP
    (async () => {
      try {
        buildTimeline();
        await ensureFontsReady();
        tl.time(1.2); // Show Scene 1 ready state on initial load
        drawFrame(ctx);
        statusEl.textContent = "Ready — Click ▶ Preview or ⬇ Export MP4";
      } catch (err) {
        showError(`Initialization error: ${err.message}`);
      }
    })();

    previewBtn.addEventListener("click", startPreview);
    exportBtn.addEventListener("click", exportMP4);
  </script>
</body>
</html>
