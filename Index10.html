    // ============================================================================

    // ============================================================================
    const SFX_CUES = [
      // SCENE 1 (0 - 4s)
      { t: 0.2, type: "whoosh" },
      { t: 0.5, type: "tick" },
      { t: 0.9, type: "pop" },

    function createDeterministicNoiseBuffer(ctx, durationSec) {
      const length = Math.ceil(ctx.sampleRate * durationSec);
      const buffer = ctx.createBuffer(1, length, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      let seed = 1337420;
      for (let i = 0; i < length; i++) {
        seed = (seed * 1664525 + 1013904223) >>> 0;
        data[i] = (seed / 0xffffffff) * 2 - 1;
      }
      return buffer;
    }

    function createMasterChain(ctx, destinationNode) {
      const compressor = ctx.createDynamicsCompressor();
      compressor.threshold.setValueAtTime(-12, 0);
      compressor.knee.setValueAtTime(10, 0);
      compressor.ratio.setValueAtTime(8, 0);
      compressor.attack.setValueAtTime(0.003, 0);
      compressor.release.setValueAtTime(0.15, 0);

      const masterGain = ctx.createGain();
      masterGain.gain.setValueAtTime(0.25, 0);

      masterGain.connect(compressor);
      compressor.connect(destinationNode || ctx.destination);
      return masterGain;
    }

    function synthWhoosh(ctx, dest, t, noiseBuf) {
      const src = ctx.createBufferSource();
      src.buffer = noiseBuf;
      const filter = ctx.createBiquadFilter();
      filter.type = "bandpass";
      filter.Q.setValueAtTime(1.8, t);
      filter.frequency.setValueAtTime(400, t);
      filter.frequency.exponentialRampToValueAtTime(2500, t + 0.35);

      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.linearRampToValueAtTime(0.32, t + 0.08);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);

      src.connect(filter);
      filter.connect(gain);
      gain.connect(dest);
      src.start(t);
      src.stop(t + 0.36);
    }

    function synthPop(ctx, dest, t) {
      const osc = ctx.createOscillator();
      osc.type = "sine";
      osc.frequency.setValueAtTime(700, t);
      osc.frequency.exponentialRampToValueAtTime(250, t + 0.12);

      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.linearRampToValueAtTime(0.48, t + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);

      osc.connect(gain);
      gain.connect(dest);
      osc.start(t);
      osc.stop(t + 0.13);
    }

    function synthTick(ctx, dest, t) {
      const osc = ctx.createOscillator();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(1200, t);

      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.linearRampToValueAtTime(0.35, t + 0.004);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);

      osc.connect(gain);
      gain.connect(dest);
      osc.start(t);
      osc.stop(t + 0.055);
    }

    function synthType(ctx, dest, t, noiseBuf) {
      const src = ctx.createBufferSource();
      src.buffer = noiseBuf;
      const filter = ctx.createBiquadFilter();
      filter.type = "bandpass";
      filter.Q.setValueAtTime(2.5, t);
      filter.frequency.setValueAtTime(2200, t);

      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.linearRampToValueAtTime(0.28, t + 0.003);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.03);

      src.connect(filter);
      filter.connect(gain);
      gain.connect(dest);
      src.start(t);
      src.stop(t + 0.035);
    }

    function synthSlide(ctx, dest, t, noiseBuf) {
      const src = ctx.createBufferSource();
      src.buffer = noiseBuf;
      const filter = ctx.createBiquadFilter();
      filter.type = "bandpass";
      filter.Q.setValueAtTime(2.0, t);
      filter.frequency.setValueAtTime(600, t);
      filter.frequency.exponentialRampToValueAtTime(1600, t + 0.2);

      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.linearRampToValueAtTime(0.18, t + 0.04);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);

      src.connect(filter);
      filter.connect(gain);
      gain.connect(dest);
      src.start(t);
      src.stop(t + 0.21);
    }

    function synthChime(ctx, dest, t) {
      const notes = [
        { freq: 880, offset: 0, dur: 0.35 },
        { freq: 1320, offset: 0.09, dur: 0.4 }
      ];
      notes.forEach(n => {
        const osc = ctx.createOscillator();
        osc.type = "sine";
        const start = t + n.offset;
        osc.frequency.setValueAtTime(n.freq, start);

        const gain = ctx.createGain();
        gain.gain.setValueAtTime(0.0001, start);
        gain.gain.linearRampToValueAtTime(0.38, start + 0.012);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + n.dur);

        osc.connect(gain);
        gain.connect(dest);
        osc.start(start);
        osc.stop(start + n.dur + 0.01);
      });
    }

    function synthEmptyPing(ctx, dest, t) {
      const notes = [
        { freq: 520, offset: 0, dur: 0.18 },
        { freq: 390, offset: 0.12, dur: 0.23 }
      ];
      notes.forEach(n => {
        const osc = ctx.createOscillator();
        osc.type = "sine";
        const start = t + n.offset;
        osc.frequency.setValueAtTime(n.freq, start);

        const gain = ctx.createGain();
        gain.gain.setValueAtTime(0.0001, start);
        gain.gain.linearRampToValueAtTime(0.32, start + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + n.dur);

        osc.connect(gain);
        gain.connect(dest);
        osc.start(start);
        osc.stop(start + n.dur + 0.01);
      });
    }

    function synthFinalChime(ctx, dest, t) {
      const notes = [
        { freq: 660, offset: 0, dur: 0.65 },
        { freq: 880, offset: 0.11, dur: 0.72 },
        { freq: 1320, offset: 0.22, dur: 0.8 }
      ];
      notes.forEach(n => {
        const osc = ctx.createOscillator();
        osc.type = "sine";
        const start = t + n.offset;
        osc.frequency.setValueAtTime(n.freq, start);

        const gain = ctx.createGain();
        gain.gain.setValueAtTime(0.0001, start);
        gain.gain.linearRampToValueAtTime(0.36, start + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + n.dur);

        osc.connect(gain);
        gain.connect(dest);
        osc.start(start);
        osc.stop(start + n.dur + 0.02);
      });
    }

    function scheduleAllCues(ctx, baseTime = 0, destinationNode = null) {
      const master = createMasterChain(ctx, destinationNode);
      const noiseBuf = createDeterministicNoiseBuffer(ctx, 0.5);
      for (const cue of SFX_CUES) {
        const t = baseTime + cue.t;
        switch (cue.type) {
          case "whoosh": synthWhoosh(ctx, master, t, noiseBuf); break;
          case "pop": synthPop(ctx, master, t); break;
          case "tick": synthTick(ctx, master, t); break;
          case "type": synthType(ctx, master, t, noiseBuf); break;
          case "slide": synthSlide(ctx, master, t, noiseBuf); break;
          case "chime": synthChime(ctx, master, t); break;
          case "empty-ping": synthEmptyPing(ctx, master, t); break;
          case "final-chime": synthFinalChime(ctx, master, t); break;
        }
      }
    }

    // ============================================================================
    // ANIMATION STATE & GSAP MASTER TIMELINE
    // ============================================================================

        s5SubY: 25, s5SubOpacity: 0,

    resetState();
    const tl = gsap.timeline({ paused: true });

    function buildTimeline() {
      tl.clear();
      resetState();

      // ---------------- SCENE 1 (0 - 4s) ----------------
      tl.set(state, { s1Alpha: 1 }, 0);
      tl.to(state, { s1HeadY: 0, s1HeadOpacity: 1, duration: 0.5, ease: "power3.out" }, 0.2);

      // ---------------- SCENE 3 (8 - 12s) ----------------

      tl.to(state, { s3Star2: 1, duration: 0.18, ease: "back.out(2)" }, 9.5);
      tl.to(state, { s3Star3: 1, duration: 0.18, ease: "back.out(2)" }, 9.7);
      tl.to(state, { s3Star4: 1, duration: 0.18, ease: "back.out(2)" }, 9.9);
      tl.to(state, { s3Star5: 1, duration: 0.18, ease: "back.out(2)" }, 10.1);
      tl.to(state, { s3RatingScale: 1, s3RatingOpacity: 1, duration: 0.4, ease: "back.out(1.8)" }, 10.5);
      tl.to(state, { s3Tile1Y: 0, s3Tile1Opacity: 1, duration: 0.35, ease: "power3.out" }, 10.9);
      tl.to(state, { s3Tile2Y: 0, s3Tile2Opacity: 1, duration: 0.35, ease: "power3.out" }, 11.1);
      tl.to(state, { s3Tile3Y: 0, s3Tile3Opacity: 1, duration: 0.35, ease: "power3.out" }, 11.3);
      tl.to(state, { s3Alpha: 0, s3HeadY: -25, duration: 0.3, ease: "power2.in" }, 11.7);

      // ---------------- SCENE 4 (12 - 16s) ----------------
      tl.set(state, { s4Alpha: 1 }, 12.0);
      tl.to(state, { s4HeadY: 0, s4HeadOpacity: 1, duration: 0.5, ease: "power3.out" }, 12.0);
      tl.to(state, { s4ChipScale: 1, s4ChipOpacity: 1, duration: 0.35, ease: "back.out(1.8)" }, 12.4);
      tl.to(state, { s4CardsY: 0, s4CardsOpacity: 1, duration: 0.5, ease: "power3.out" }, 12.8);
      tl.to(state, { s4CardAOpacity: 0.4, duration: 0.35, ease: "power2.out" }, 13.6);

      // ---------------- SCENE 5 (16 - 22s) ----------------

      tl.to(state, { s5Pulse: 1, duration: 0.6, ease: "sine.inOut" }, 20.2);
      tl.to(state, { s5Pulse: 0, duration: 0.6, ease: "sine.inOut" }, 20.8);
      tl.to(state, { s5Pulse: 0.6, duration: 0.6, ease: "sine.inOut" }, 21.4);

      tl.set({}, {}, DURATION);
    }

    // ============================================================================
    // CANVAS 2D DRAWING HELPERS (ALL PERFECTLY CENTERED AT X = 540)
    // ============================================================================
    function lerpColor(hexA, hexB, t) {
      const a = parseInt(hexA.slice(1), 16);
      const b = parseInt(hexB.slice(1), 16);
      const r1 = (a >> 16) & 255, g1 = (a >> 8) & 255, b1 = a & 255;
      const r2 = (b >> 16) & 255, g2 = (b >> 8) & 255, b2 = b & 255;
      const r = Math.round(r1 + (r2 - r1) * t);
      const g = Math.round(g1 + (g2 - g1) * t);
      const bl = Math.round(b1 + (b2 - b1) * t);
      return `rgb(${r},${g},${bl})`;
    }

    function roundRectPath(ctx, x, y, w, h, r) {
      const rad = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + rad, y);
      ctx.arcTo(x + w, y, x + w, y + h, rad);
      ctx.arcTo(x + w, y + h, x, y + h, rad);
      ctx.arcTo(x, y + h, x, y, rad);
      ctx.arcTo(x, y, x + w, y, rad);
      ctx.closePath();
    }

    // Centered multi-line headline with keyword highlighting at CENTER_X (540)
    function drawHeadline(ctx, lines, highlightWord, yStart, yOffset, opacity, baseColor, highlightColor, fontSize = 92) {
      if (opacity <= 0.001) return;
      ctx.save();
      ctx.globalAlpha *= opacity;
      ctx.font = `800 ${fontSize}px 'Plus Jakarta Sans', sans-serif`;
      ctx.textBaseline = "top";
      ctx.textAlign = "left";
      const lineHeight = fontSize * 1.15;

      lines.forEach((lineText, idx) => {
        const words = lineText.split(" ");
        const spaceWidth = ctx.measureText(" ").width;
        const wordMetrics = words.map(w => ({
          word: w,
          clean: w.replace(/[^a-zA-Z]/g, "").toLowerCase(),
          width: ctx.measureText(w).width
        }));
        const totalWidth = wordMetrics.reduce((acc, m) => acc + m.width, 0) + spaceWidth * (words.length - 1);
        let curX = CENTER_X - totalWidth / 2;
        const curY = yStart + yOffset + idx * lineHeight;

        wordMetrics.forEach(m => {
          const isHighlight = highlightWord && m.clean === highlightWord.toLowerCase();
          ctx.fillStyle = isHighlight ? highlightColor : baseColor;
          ctx.fillText(m.word, curX, curY);
          curX += m.width + spaceWidth;
        });
      });
      ctx.restore();
    }

    // Floating Chip centered at CENTER_X (540)
    function drawChip(ctx, text, scale, opacity, bgColor, textColor) {
      if (opacity <= 0.001 || scale <= 0.001) return;
      ctx.save();
      ctx.globalAlpha *= opacity;
      const cy = 344;
      ctx.translate(CENTER_X, cy);
      ctx.scale(scale, scale);

      ctx.font = `700 40px 'Plus Jakarta Sans', sans-serif`;
      const tw = ctx.measureText(text).width;
      const pw = tw + 64;
      const ph = 68;

      roundRectPath(ctx, -pw / 2, -ph / 2, pw, ph, 34);
      ctx.fillStyle = bgColor;
      ctx.fill();

      ctx.fillStyle = textColor;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(text, 0, 2);
      ctx.restore();
    }

    function drawToothIcon(ctx, cx, cy, size, fillStyle) {
      ctx.save();
      ctx.translate(cx, cy);
      const s = size / 200;
      ctx.scale(s, s);

      ctx.beginPath();
      ctx.moveTo(0, -78);
      ctx.bezierCurveTo(-32, -105, -95, -95, -95, -35);
      ctx.bezierCurveTo(-95, 10, -75, 42, -62, 88);
      ctx.bezierCurveTo(-55, 112, -36, 112, -26, 82);
      ctx.bezierCurveTo(-14, 45, 14, 45, 26, 82);
      ctx.bezierCurveTo(36, 112, 55, 112, 62, 88);
      ctx.bezierCurveTo(75, 42, 95, 10, 95, -35);
      ctx.bezierCurveTo(95, -95, 32, -105, 0, -78);
      ctx.closePath();

      ctx.fillStyle = fillStyle;
      ctx.fill();
      ctx.restore();
    }

    function drawStar(ctx, cx, cy, outerR, innerR, fillProgress) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.beginPath();
      for (let i = 0; i < 10; i++) {
        const angle = -Math.PI / 2 + (i * Math.PI) / 5;
        const r = i % 2 === 0 ? outerR : innerR;
        const x = Math.cos(angle) * r;
        const y = Math.sin(angle) * r;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.fillStyle = "#E2ECEF";
      ctx.fill();

      if (fillProgress > 0.01) {
        ctx.save();
        ctx.scale(fillProgress, fillProgress);
        ctx.fillStyle = "#FFB800";
        ctx.fill();
        ctx.restore();
      }
      ctx.restore();
    }

    function drawMagnifierIcon(ctx, cx, cy, r, color) {
      ctx.save();
      ctx.strokeStyle = color;
      ctx.lineWidth = 5;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.arc(cx - 3, cy - 3, r * 0.65, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(cx + r * 0.35, cy + r * 0.35);
      ctx.lineTo(cx + r * 0.85, cy + r * 0.85);
      ctx.stroke();
      ctx.restore();
    }

      ctx.scale(s, s);
      ctx.strokeStyle = color;
      ctx.lineWidth = 6;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.beginPath();
      ctx.moveTo(-18, -22);
      ctx.lineTo(-8, -22);
      ctx.lineTo(-2, -8);
      ctx.lineTo(-10, -2);
      ctx.arcTo(-4, 10, 8, 16, 16);
      ctx.lineTo(10, 2);
      ctx.lineTo(24, 8);
      ctx.lineTo(24, 18);
      ctx.bezierCurveTo(24, 26, 6, 28, -10, 12);
      ctx.bezierCurveTo(-26, -4, -24, -22, -18, -22);
      ctx.stroke();
      ctx.restore();
    }

    function drawCalendarIcon(ctx, cx, cy, size, color) {
      ctx.save();

      ctx.scale(s, s);
      ctx.strokeStyle = color;
      ctx.lineWidth = 5.5;
      ctx.lineCap = "round";

      roundRectPath(ctx, -24, -18, 48, 42, 8);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(-24, -4);
      ctx.lineTo(24, -4);
      ctx.moveTo(-12, -26);
      ctx.lineTo(-12, -12);
      ctx.moveTo(12, -26);
      ctx.lineTo(12, -12);
      ctx.stroke();
      ctx.restore();
    }

    function drawTickIcon(ctx, cx, cy, radius, bgCol, tickCol) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.beginPath();
      ctx.arc(0, 0, radius, 0, Math.PI * 2);
      ctx.fillStyle = bgCol;
      ctx.fill();

      ctx.strokeStyle = tickCol;
      ctx.lineWidth = 6.5;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.beginPath();
      ctx.moveTo(-radius * 0.42, 0);
      ctx.lineTo(-radius * 0.1, radius * 0.32);
      ctx.lineTo(radius * 0.45, -radius * 0.28);
      ctx.stroke();
      ctx.restore();
    }

    let isExporting = false;

    function showError(msg) {
      errorBox.style.display = "block";
      errorBox.textContent = msg;
    }

    function clearError() {
      errorBox.style.display = "none";
      errorBox.textContent = "";
    }

    function stopPreview() {
      if (previewRafId) {
        cancelAnimationFrame(previewRafId);
        previewRafId = null;
      }
      if (previewAudioCtx) {
        try { previewAudioCtx.close(); } catch (e) {}
        previewAudioCtx = null;
      }
      previewBtn.textContent = "▶ Preview";
    }

    async function startPreview() {
      if (isExporting) return;
      clearError();
      stopPreview();

      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      previewAudioCtx = new AudioCtx();
      if (previewAudioCtx.state === "suspended") {
        await previewAudioCtx.resume();
      }

      const startOffset = previewAudioCtx.currentTime + 0.05;
      scheduleAllCues(previewAudioCtx, startOffset);

      previewBtn.textContent = "⏹ Stop Preview";
      statusText.textContent = "Playing preview...";

      function tick() {
        if (!previewAudioCtx) return;
        const elapsed = Math.max(0, previewAudioCtx.currentTime - startOffset);
        if (elapsed >= DURATION) {
          tl.time(DURATION);
          drawFrame(ctx);
          stopPreview();
          statusText.textContent = "Preview complete (22.0s).";
          return;
        }
        tl.time(elapsed);
        drawFrame(ctx);
        statusText.textContent = `Previewing ${elapsed.toFixed(1)}s / ${DURATION}s`;
        previewRafId = requestAnimationFrame(tick);
      }

      previewRafId = requestAnimationFrame(tick);
    }

    previewBtn.addEventListener("click", () => {
      if (previewAudioCtx) {
        stopPreview();
        statusText.textContent = "Preview stopped.";
      } else {
        startPreview();
      }
    });

    async function renderOfflineAudio() {
      const sampleRate = 44100;
      const totalSamples = sampleRate * DURATION;
      const offlineCtx = new OfflineAudioContext(2, totalSamples, sampleRate);
      scheduleAllCues(offlineCtx, 0);
      return await offlineCtx.startRendering();
    }

    async function fallbackMediaRecorderExport() {
      statusText.textContent = "WebCodecs unavailable — using real-time MediaRecorder fallback...";
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      const recAudioCtx = new AudioCtx();
      if (recAudioCtx.state === "suspended") await recAudioCtx.resume();

      const dest = recAudioCtx.createMediaStreamDestination();
      const startOffset = recAudioCtx.currentTime + 0.08;
      scheduleAllCues(recAudioCtx, startOffset, dest);
      scheduleAllCues(recAudioCtx, startOffset, recAudioCtx.destination);

      const canvasStream = canvas.captureStream(FPS);
      const combined = new MediaStream([
        ...canvasStream.getVideoTracks(),
        ...dest.stream.getAudioTracks()
      ]);

      const mimeTypes = [
        "video/mp4;codecs=avc1,mp4a.40.2",
        "video/mp4",
        "video/webm;codecs=vp9,opus",
        "video/webm"
      ];
      const chosenMime = mimeTypes.find(m => MediaRecorder.isTypeSupported(m)) || "";
      const recorder = new MediaRecorder(combined, chosenMime ? { mimeType: chosenMime, videoBitsPerSecond: 8_000_000 } : undefined);
      const chunks = [];
      recorder.ondataavailable = e => { if (e.data && e.data.size > 0) chunks.push(e.data); };

      const donePromise = new Promise((resolve, reject) => {
        recorder.onstop = resolve;
        recorder.onerror = e => reject(e.error || new Error("MediaRecorder failed"));
      });

      recorder.start();

      await new Promise(resolve => {
        function step() {
          const elapsed = Math.max(0, recAudioCtx.currentTime - startOffset);
          const pct = Math.min(100, Math.round((elapsed / DURATION) * 100));
          statusText.textContent = `Fallback real-time recording: ${pct}%`;
          if (elapsed >= DURATION) {
            tl.time(DURATION);
            drawFrame(ctx);
            resolve();
            return;
          }
          tl.time(elapsed);
          drawFrame(ctx);
          requestAnimationFrame(step);
        }
        requestAnimationFrame(step);
      });

      recorder.stop();
      await donePromise;
      try { await recAudioCtx.close(); } catch (e) {}

      const ext = chosenMime.includes("mp4") ? "mp4" : "webm";
      const blob = new Blob(chunks, { type: chosenMime || "video/mp4" });
      finishExportBlob(blob, `ezsites-how-patients-choose-reel.${ext}`, "Exported via MediaRecorder fallback.");
    }

    function finishExportBlob(blob, filename, note = "Export complete!") {
      const url = URL.createObjectURL(blob);
      downloadAgainLink.href = url;
      downloadAgainLink.download = filename;
      resultVideo.src = url;
      resultArea.style.display = "flex";

      const autoLink = document.createElement("a");
      autoLink.href = url;
      autoLink.download = filename;
      document.body.appendChild(autoLink);
      autoLink.click();
      autoLink.remove();

      statusText.textContent = note;
    }

    async function exportMP4() {
      if (isExporting) return;
      stopPreview();
      clearError();
      isExporting = true;
      previewBtn.disabled = true;
      exportBtn.disabled = true;
      resultArea.style.display = "none";

      let wakeLock = null;
      try {
        if ("wakeLock" in navigator) {
          wakeLock = await navigator.wakeLock.request("screen");
        }
      } catch (e) {}

      try {
        if (typeof VideoEncoder === "undefined") {
          await fallbackMediaRecorderExport();
          return;
        }

        const codecCandidates = ["avc1.64002A", "avc1.640028", "avc1.4D0028"];
        let selectedVideoConfig = null;
        for (const c of codecCandidates) {
          const cfg = {
            codec: c,
            width: WIDTH,
            height: HEIGHT,
            bitrate: 8_000_000,
            framerate: FPS
          };
          const res = await VideoEncoder.isConfigSupported(cfg);
          if (res.supported) {
            selectedVideoConfig = cfg;
            break;
          }
        }

        if (!selectedVideoConfig) {
          await fallbackMediaRecorderExport();
          return;
        }

        let includeAudio = false;
        const audioConfig = {
          codec: "mp4a.40.2",
          sampleRate: 44100,
          numberOfChannels: 2,
          bitrate: 128000
        };
        if (typeof AudioEncoder !== "undefined") {
          try {
            const aRes = await AudioEncoder.isConfigSupported(audioConfig);
            includeAudio = !!aRes.supported;
          } catch (e) {
            includeAudio = false;
          }
        }

        statusText.textContent = "Rendering offline audio track...";
        const audioBuffer = includeAudio ? await renderOfflineAudio() : null;

        const muxerOptions = {
          target: new ArrayBufferTarget(),
          video: {
            codec: "avc",
            width: WIDTH,
            height: HEIGHT
          },
          fastStart: "in-memory"
        };
        if (includeAudio) {
          muxerOptions.audio = {
            codec: "aac",
            numberOfChannels: 2,
            sampleRate: 44100
          };
        }
        const muxer = new Muxer(muxerOptions);

        let encoderError = null;

        const videoEncoder = new VideoEncoder({
          output: (chunk, meta) => muxer.addVideoChunk(chunk, meta),
          error: err => { encoderError = err; }
        });
        videoEncoder.configure(selectedVideoConfig);

        let audioEncoder = null;
        if (includeAudio && audioBuffer) {
          audioEncoder = new AudioEncoder({
            output: (chunk, meta) => muxer.addAudioChunk(chunk, meta),
            error: err => { encoderError = err; }
          });
          audioEncoder.configure(audioConfig);

          const ch0 = audioBuffer.getChannelData(0);
          const ch1 = audioBuffer.getChannelData(1);
          const chunkSize = 1024;
          const totalFrames = audioBuffer.length;

          for (let offset = 0; offset < totalFrames; offset += chunkSize) {
            if (encoderError) throw encoderError;
            const len = Math.min(chunkSize, totalFrames - offset);
            const planarData = new Float32Array(len * 2);
            planarData.set(ch0.subarray(offset, offset + len), 0);
            planarData.set(ch1.subarray(offset, offset + len), len);

            const timestampUs = Math.round((offset / 44100) * 1_000_000);
            const audioData = new AudioData({
              format: "f32-planar",
              sampleRate: 44100,
              numberOfFrames: len,
              numberOfChannels: 2,
              timestamp: timestampUs,
              data: planarData
            });
            audioEncoder.encode(audioData);
            audioData.close();
          }
          await audioEncoder.flush();
        }

        const totalVideoFrames = DURATION * FPS;
        const frameDurationUs = Math.round(1_000_000 / FPS);

        for (let i = 0; i < totalVideoFrames; i++) {
          if (encoderError) throw encoderError;

          const t = i / FPS;
          tl.time(t);
          drawFrame(ctx);

          const timestampUs = Math.round((i * 1_000_000) / FPS);
          const frame = new VideoFrame(canvas, {
            timestamp: timestampUs,
            duration: frameDurationUs
          });

          videoEncoder.encode(frame, { keyFrame: i % 30 === 0 });
          frame.close();

          while (videoEncoder.encodeQueueSize > 8) {
            if (encoderError) throw encoderError;
            await new Promise(r => setTimeout(r, 4));
          }

          if (i % 10 === 0 || i === totalVideoFrames - 1) {
            const pct = Math.round(((i + 1) / totalVideoFrames) * 100);
            statusText.textContent = `Exporting ${pct}%`;
            await new Promise(r => setTimeout(r, 0));
          }
        }

        await videoEncoder.flush();
        if (encoderError) throw encoderError;

        muxer.finalize();
        const { buffer } = muxer.target;
        const blob = new Blob([buffer], { type: "video/mp4" });

        const finishNote = includeAudio
          ? "Export complete! (MP4 with video + SFX audio track)"
          : "Export complete! (Note: AudioEncoder was unsupported in this browser, so video was exported without audio)";
        finishExportBlob(blob, "ezsites-how-patients-choose-reel.mp4", finishNote);
      } catch (err) {
        console.error(err);
        showError(`Export failed: ${err && err.message ? err.message : String(err)}`);
        statusText.textContent = "Export encountered an error.";
      } finally {
        if (wakeLock) {
          try { await wakeLock.release(); } catch (e) {}
        }
        isExporting = false;
        previewBtn.disabled = false;
        exportBtn.disabled = false;
      }
    }

    exportBtn.addEventListener("click", exportMP4);

    // ============================================================================
    // BOOTSTRAP: AWAIT FONTS BEFORE INITIAL DRAW
    // ============================================================================
    async function init() {
      try {
        await Promise.all([
          document.fonts.load("500 48px 'Plus Jakarta Sans'"),
          document.fonts.load("700 48px 'Plus Jakarta Sans'"),
          document.fonts.load("800 92px 'Plus Jakarta Sans'")
        ]);
        await document.fonts.ready;

        buildTimeline();
        tl.time(1.9);
        drawFrame(ctx);

        previewBtn.disabled = false;
        exportBtn.disabled = false;
        statusText.textContent = "Ready — Click Preview or Export MP4.";
      } catch (err) {
        showError(`Initialization error: ${err.message}`);
      }
    }

    init();
  </script>
</body>
</html>
